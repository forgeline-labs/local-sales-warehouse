name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare environment
        run: ./setup

      - name: Install pinned development tools
        run: .venv/bin/python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check app setup tests .

      - name: Format check
        run: .venv/bin/ruff format --check app setup tests .

      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests -v
